description: SOLOMON SYSTECH LCD display controller

compatible: "solomon,spd2010-display"

include: [spi-device.yaml, display-controller.yaml]

properties:
    reset-gpios:
      type: phandle-array
      required: false
      description: |
        RESET pin.

        The RESET pin of LWEA2012 is active low.
        If connected directly the MCU pin should be configured
        as active low.

    cmd-data-gpios:
      type: phandle-array
      required: true
      description: |
        D/CX pin.

        The D/CX pin of LWEA2012 is active low (transmission command byte).
        If connected directly the MCU pin should be configured
        as active low.
    te-gpios:
      type: phandle-array
      required: false
      description: |
        TE pin.

        Frame head pulse signal. Utilize this signal when
        synchronizing RAM data write operations.

    backlight-pwms:
      type: phandle-array
      required: true
      description: |
        The backlight pwm is used to control the brightness of the LCD.

    bl—default-brightness:
      type: phandle-array
      required: true
      description: |
        The backlight pwm is used to control the brightness of the LCD.

    x-offset:
      type: int
      required: true
      description: The column offset in pixels of the LCD to the controller memory

    y-offset:
      type: int
      required: true
      description: The row offset in pixels of the LCD to the controller memory

    inversion-on:
      type: boolean
      description: |
        Enable Display Inversion
        Make a drawing with the inverted color of the frame memory.
