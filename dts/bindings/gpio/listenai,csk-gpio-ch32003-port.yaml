description: CH32V003 I2C-based GPIO expander

compatible: "listenai,csk-gpio-ch32003-port"

include: [gpio-controller.yaml, base.yaml]

properties:
    reg:
        required: true

    label:
        required: true

    pin_mask:
      type: int
      required: false

    "#gpio-cells":
      const: 2

gpio-cells:
  - pin
  - flags
