description: 1/15 inch QVGA CMOS Image Sensor

compatible: "byd,bf30a2"

properties:
    pd-gpios:
      type: phandle-array
      required: true
      description: pd-gpios
    pwr-gpios:
      type: phandle-array
      required: true
      description: power-gpios
    product-id:
      type: int
      required: false
      description: product-id
    csk6-spec:
      type: boolean
      required: false
      description: csk6-spec
    label:
      type: string
      required: true
      description: label
    reg :
      type: array
      required: true
      description: reg
    spi:
      type: phandle
      required: false
      description: spi-bus
    pwms:
      type: phandle-array
      required: true
      description: pwm output to xclk
    xclk-freq:
      type: int
      required: true
      description: xclk-freq

include: i2c-device.yaml
