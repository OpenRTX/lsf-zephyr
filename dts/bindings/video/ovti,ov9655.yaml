description: OV9655 CMOS video sensor

compatible: "ovti,ov9655"

properties:
    reset-gpios:
      type: phandle-array
      required: false
      description: |
        The RESET pin is asserted to disable the sensor causing a hard
        reset.  The sensor receives this as an active-low signal.

    pwdn-gpios:
      type: phandle-array
      required: false
      description: |
        The PWDN pin is asserted to disable the sensor causing a power
        down.  The sensor receives this as an active-high signal.

include: i2c-device.yaml