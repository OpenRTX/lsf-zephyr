# SPDX-License-Identifier: Apache-2.0

description: LISTENAI CSK6 pinmux (aka IOCON) node

compatible: "listenai,csk-pinmux"

include: base.yaml

properties:
    reg:
      required: true

    "#pinmux-cells":
      type: int
      required: true
      const: 2
      description: Number of items in a pinmux specifier

pinmux-cells:
  - pin
  - function

pinctrl-cells:
  - pin
  - alt_func