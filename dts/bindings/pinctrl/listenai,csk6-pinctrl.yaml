compatible: "listenai,csk-pinctrl"

include:
    - name: base.yaml
    - name: pincfg-node.yaml
      child-binding:
        property-allowlist:
          - bias-high-impedance
          - bias-pull-pin-default
          - bias-pull-up
          - bias-pull-down
          - input-enable

child-binding:
    description: |
        This binding gives a base representation of the CSK6 pins configration.
    properties:
        pinctrls:
          required: false
          type: phandle-array
          description: |
              CSK6 pin's configuration (pinctrl node, pin and function).


