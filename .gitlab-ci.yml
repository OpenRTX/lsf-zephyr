image: "espressif/idf:release-v4.4"

stages:
  - build
  - packbin

build:
  script:
    - docker run -v ${PWD}:/esp-hosted --name esp-idf espressif/idf:release-v4.4 bash -c
      "mv /opt/esp/idf/components/protocomm/src/common/protocomm_priv.h /opt/esp/idf/components/protocomm/include/common/ &&
        cd esp-hosted/esp-hosted/esp/esp_driver/network_adapter &&
        idf.py set-target esp32c3 &&
        idf.py build &&
        esptool.py --chip esp32c3 merge_bin -o esp-hosted-merged.bin --flash_mode dio --flash_size 4MB 0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0xd000 build/ota_data_initial.bin 0x10000 build/network_adapter.bin"
    - pwd
    - docker cp esp-idf:esp-hosted/esp-hosted/esp/esp_driver/network_adapter/build .
    - docker rm -v esp-idf
    - ls build

  stage: build
  tags:
    - iflyos-builder

packbin:
  script:
    - ls esp-hosted/esp/esp_driver/network_adapter
  stage: packbin
  tags:
    - iflyos-builder

