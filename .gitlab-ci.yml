image: "espressif/idf:release-v4.4"

stages:
  - build
  - packbin

build:
  script:
    - docker run --rm -v ${PWD}:/esp-hosted espressif/idf:release-v4.4 bash -c
      "mv /opt/esp/idf/components/protocomm/src/common/protocomm_priv.h /opt/esp/idf/components/protocomm/include/common/ &&
        cd esp-hosted/esp-hosted/esp/esp_driver/network_adapter &&
        idf.py set-target esp32c3 &&
        idf.py build"

  stage: build
  tags:
    - iflyos-builder

packbin:
  script:
    - ls esp-hosted/esp/esp_driver/network_adapter
  stage: packbin
  tags:
    - iflyos-builder

