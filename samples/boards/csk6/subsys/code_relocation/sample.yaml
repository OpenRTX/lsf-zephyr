sample:
  description: Code data relocation Sample
  name: code relocation
tests:
  sample.application_development.code_relocation:
    harness: console
    harness_config:
      type: one_line
      regex:
      - "Hello World! (.*)"
    platform_allow: csk6011a_nano
    tags: linker
    extra_sections: _SRAM_TEXT_SECTION_NAME _SRAM_RODATA_SECTION_NAME _SRAM_DATA_SECTION_NAME _CUSTOM_SECTION_NAME2
