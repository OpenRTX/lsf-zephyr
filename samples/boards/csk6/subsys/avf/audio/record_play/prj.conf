CONFIG_PRINTK=y
CONFIG_DEBUG=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DETECT_MISSED_STRDUP=n
CONFIG_LOG_BACKEND_SHOW_COLOR=y
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_OUTPUT_TEXT=y
CONFIG_MAIN_STACK_SIZE=2048
#system heap size,users can define it according to the actual usage
CONFIG_HEAP_MEM_POOL_SIZE=280000
#avf
CONFIG_AVF=y
CONFIG_AVF_DEBUG_LEVEL=1
CONFIG_AVF_USE_BINARY_ARRAY=y

#licak
CONFIG_LICAK=y
CONFIG_LICAK_MODULES_AUDIO_PLAYBACK=y
CONFIG_LICAK_MODULES_AUDIO_CAPTURE=y
CONFIG_LICAK_DISABLE_MULTI_HEAP_INIT=y

#IPM and GPIO for avf driver
CONFIG_IPM=y
#cache
CONFIG_CACHE_MANAGEMENT=y
#psram init for avf ipc share memory
CONFIG_CSK6_PSRAM=y
CONFIG_NEWLIB_LIBC=y
#IPM and GPIO for avf driver
CONFIG_GPIO=y
