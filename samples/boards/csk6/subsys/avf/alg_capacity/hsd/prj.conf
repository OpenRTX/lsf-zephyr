CONFIG_PRINTK=y
CONFIG_DEBUG=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DETECT_MISSED_STRDUP=n
CONFIG_LOG_BACKEND_SHOW_COLOR=y
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_OUTPUT_TEXT=y
CONFIG_MAIN_STACK_SIZE=2048

#system heap size,users can define it according to the actual usage
CONFIG_HEAP_MEM_POOL_SIZE=92160
CONFIG_CSK_HEAP=y
CONFIG_CSK_HEAP_MEM_POOL_SIZE=256000

#avf
CONFIG_AVF=y
# CONFIG_AVF_DSP_XIP=y
CONFIG_AVF_DSP_RUN_ADDRESS=0x60000000
CONFIG_AVF_DEBUG_LEVEL=5
CONFIG_AVF_MODULES_ALG_HSD_DBG=y
CONFIG_AVF_USE_BINARY_ARRAY=y
CONFIG_AVF_MODULES_ALG_HSD=y

# dvp
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_VIDEO=y
CONFIG_VIDEO_CSK6_DVP=y
CONFIG_VIDEO_OV9655=y

CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=360000
CONFIG_VIDEO_CUSTOM_SECTION=y
CONFIG_VIDEO_CUSTOM_SECTION_NAME=".psram_section"

#licak
CONFIG_LICAK=y

#IPM and GPIO for avf driver
CONFIG_IPM=y
CONFIG_GPIO=y

#cache
CONFIG_CACHE_MANAGEMENT=y



