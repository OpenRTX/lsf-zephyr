CONFIG_PRINTK=y
CONFIG_DEBUG=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DETECT_MISSED_STRDUP=n
CONFIG_LOG_BACKEND_SHOW_COLOR=y
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_OUTPUT_TEXT=y
CONFIG_MAIN_STACK_SIZE=2048

#main heap size,users can define it according to the actual usage
CONFIG_HEAP_MEM_POOL_SIZE=92160


#psram init for avf ipc share memory
CONFIG_CSK6_PSRAM=y
CONFIG_NEWLIB_LIBC=y
CONFIG_TEST_RANDOM_GENERATOR=y

#file system for avf tplg and dsp fw storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_CODEPAGE=936
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=255
CONFIG_FS_FATFS_LFN_MODE_BSS=y
CONFIG_DISK_DRIVER_FLASH=y
CONFIG_POSIX_MAX_FDS=16 

#usb mass storage for avf tplg and dsp fw update
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Zephyr DFU sample"
CONFIG_USB_MASS_STORAGE=y
CONFIG_MASS_STORAGE_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MASS_STORAGE_DISK_NAME="NAND"

#usb cdc for vcapture data transfer
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096

#Fixd for WinUSB driver install.
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x200

#avf 
CONFIG_SOF_HOST=y
CONFIG_AVF_DEBUG_LEVEL=5
CONFIG_AVF_STREAM_SVR_DEBUG=n
CONFIG_AVF_USE_FS_FATFS=y
#sof example usr lisa heap 96k
CONFIG_LISA_HEAP_ARENA_SIZE=96304

#IPM and GPIO Driver
CONFIG_IPM=y
CONFIG_GPIO=y

#cache
CONFIG_CACHE_MANAGEMENT=y

#shell
CONFIG_SHELL_ARGC_MAX=16
CONFIG_SHELL=y
CONFIG_SHELL_LOG_BACKEND=n

# video
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_DMA=y
CONFIG_PWM=y
CONFIG_VIDEO=y
CONFIG_VIDEO_BF30A2=y
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=0

