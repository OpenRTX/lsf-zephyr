CONFIG_STDOUT_CONSOLE=y

#USB related configs
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Zephyr USB audio sample"

#LOG subsystem related configs
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
# CONFIG_LOG_BUFFER_SIZE=20480
# CONFIG_USB_DRIVER_LOG_LEVEL_ERR=y

#Ring buffer
CONFIG_RING_BUFFER=y

#net buf options
CONFIG_NET_BUF=y
CONFIG_NET_BUF_USER_DATA_SIZE=0

#USB audio related configs
CONFIG_USB_DEVICE_AUDIO=y

CONFIG_USB_DEVICE_VID=0x3421
CONFIG_USB_DEVICE_PID=0x0109
CONFIG_USB_DEVICE_MANUFACTURER="ListenAI"
CONFIG_USB_DEVICE_PRODUCT="ListenAi USB audio"
CONFIG_USB_DEVICE_SN="0123456789ABCDB1"

CONFIG_MAIN_STACK_SIZE=2048

#system heap size,users can define it according to the actual usage
CONFIG_HEAP_MEM_POOL_SIZE=92160

#avf
CONFIG_AVF=y
CONFIG_AVF_DEBUG_LEVEL=1
CONFIG_AVF_USE_BINARY_ARRAY=y

#licak
CONFIG_LICAK=y
CONFIG_LICAK_MODULES_AUDIO_PLAYBACK=y
CONFIG_LICAK_DISABLE_MULTI_HEAP_INIT=y

#IPM and GPIO for avf driver
CONFIG_IPM=y
CONFIG_GPIO=y

#cache
CONFIG_CACHE_MANAGEMENT=y
# CONFIG_USB_AUDIO_LOG_LEVEL_DBG=y
