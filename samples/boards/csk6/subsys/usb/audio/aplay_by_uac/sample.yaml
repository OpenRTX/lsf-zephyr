sample:
  name: USB audio headset sample
tests:
  sample.usb.audio.headset:
    depends_on: usb_device
    tags: usb
    platform_exclude: native_posix native_posix_64
    integration_platforms:
        - csk6002_9s_nano
        - csk6002_c3_nano
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Entered main"
        - "Found USB Headset Device"
        - "USB enabled"
        - "Trigger play start success"
