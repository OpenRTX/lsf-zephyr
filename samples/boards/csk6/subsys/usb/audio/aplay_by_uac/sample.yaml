sample:
  name: USB audio aplay_by_uac sample
tests:
  sample.board.csk6.subsys.usb.audio.aplay_by_uac:
    depends_on: usb_device
    tags: csk6 usb
    platform_allow: csk6002_9s_nano csk6011a_nano csk6012_nano
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Found USB Headset Device"
        - "USB enabled"
        - "Trigger play start success"
