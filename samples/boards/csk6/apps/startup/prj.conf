CONFIG_PRINTK=y
CONFIG_DEBUG=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

#openamp config
CONFIG_OPENAMP=y
CONFIG_OPENAMP_SLAVE=n
CONFIG_CACHE_MANAGEMENT=y
CONFIG_HAS_EXTERNAL_CACHE=y

#psram init 
CONFIG_MINIMAL_LIBC_RAND=y

#file system select
#CONFIG_SECOND_CORE_LOAD_BY_LITTLEFS=y
#CONFIG_SECOND_CORE_LOAD_BY_FATFS=y
#CONFIG_SECOND_CORE_LOAD_BY_FLASH_ELF=y
#CONFIG_SECOND_CORE_LOAD_BY_FLASH_BINARY=y


#usb mass storage
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Zephyr DFU sample"
CONFIG_USB_MASS_STORAGE=y
CONFIG_MASS_STORAGE_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096


CONFIG_USB_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USB_DEVICE_LOG_LEVEL_ERR=y
CONFIG_USB_MASS_STORAGE_LOG_LEVEL_ERR=y
CONFIG_USB_DRIVER_LOG_LEVEL_ERR=y



#usb dfu
CONFIG_USB_DFU_CLASS=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_BLOCK_BUF_SIZE=4096
CONFIG_BOOTLOADER_MCUBOOT=y

#Fixd for WinUSB driver install.
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x200

