CONFIG_SOF=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_MINIMAL=y

CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_IPM=y
# Requires heap_info() be implemented, but no Zephyr wrapper
CONFIG_DEBUG_MEMORY_USAGE_SCAN=n

CONFIG_SCHED_DEADLINE=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_SMP_BOOT_DELAY=y

#mp3 deocder
CONFIG_COMP_CODEC_ADAPTER=y
CONFIG_CADENCE_CODEC=y
CONFIG_CADENCE_CODEC_MP3_DEC=y

# cp xip
CONFIG_CP_XIP=y
CONFIG_CP_XIP_RUN_ADDRESS=0x68460000
CONFIG_CP_XIP_MAX_SIZE=0x140000

# ai
CONFIG_SOF_AI_CV=y
CONFIG_SOF_AI_CUTLINE_RES_ADDR=0x685a0000
CONFIG_SOF_AI_CUTLINE_RES_SIZE=0x69228
CONFIG_SOF_AI_OCR_RES_ADDR=0x68620000
CONFIG_SOF_AI_OCR_RES_SIZE=0x26a0d8
CONFIG_SOF_AI_TTS_RES_ADDR=0x688a0000
CONFIG_SOF_AI_TRANS_RES_ADDR=0x68ae0000

# xtensa back trace
CONFIG_XTENSA_ENABLE_BACKTRACE=y

# external libc 
# CONFIG_PRINTK=y
# CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_STDOUT_CONSOLE=n
CONFIG_EXTERNAL_LIBC=y