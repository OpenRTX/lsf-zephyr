# hardware settings
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_VIDEO=y
CONFIG_VIDEO_CSK6_DVP=y
CONFIG_VIDEO_SCO30IOT=y

#log settings
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y

#buffer space settings
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=800000
CONFIG_VIDEO_CUSTOM_SECTION=y
CONFIG_VIDEO_CUSTOM_SECTION_NAME=".psram_section"
CONFIG_CSK6_PSRAM=y