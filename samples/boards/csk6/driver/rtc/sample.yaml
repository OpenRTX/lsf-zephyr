sample:
  name: rtc 

tests:
  sample.board.csk6.driver.rtc:
    platform_allow: csk6002_c3_nano csk6002_9s_nano csk6011a_nano
    tags: csk6
    timeout: 20
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "^Counter alarm callback at \\d* ms(.*)"
        - "^RTC value: \\d*s$"
