tests:
  sample.board.csk6.dma_memcpy:
    platform_allow: csk6002_c3_nano csk6002_9s_nano csk6011a_nano
    tags: csk6
    harness: console
    timeout: 10
    harness_config:
      type: multi_line
      regex:
        - "^DMA copy cost time: \\d* us$"
        - "^STD memecpy cost time: \\d* us$"
