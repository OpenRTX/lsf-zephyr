sample:
  name: soc_flash_listenai 

tests:
  sample.board.csk6.driver.soc_flash_listenai:
    platform_allow: csk6002_c3_nano csk6002_9s_nano csk6011a_9s_nano
    tags: csk6
    timeout: 30
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        -  "Flash erase succeeded"
        -  "Data read: 1234"
        -  "Data read matches data written. Good!"
        -  "Flash erase succeeded"
        -  "Data read: 1122"
        -  "Data read matches data written. Good!"
        -  "Flash erase succeeded"
        -  "Data read: 1234"
        -  "Data read: 1234"
        -  "Data read matches data written. Good!"
        -  "SoC flash consists of \\d+ pages."
        -  "write-block-size = 1"