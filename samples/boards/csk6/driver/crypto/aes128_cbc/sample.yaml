tests:
  sample.board.csk6.driver.crypto.aes128_cbc:
    platform_allow: csk6002_c3_nano csk6002_9s_nano
    tags: csk6
    timeout: 10
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Output length \\(encryption\\): 32"
        - "CBC mode ENCRYPT - Match"
        - "Output length \\(decryption\\): 32"
        - "CBC mode DECRYPT - Match"

