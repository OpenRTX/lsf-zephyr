tests:
  sample.board.csk6.driver.crypto.aes128_ecb:
    platform_allow: csk6002_c3_nano csk6002_9s_nano
    tags: csk6
    timeout: 10
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Output length \\(encryption\\): 16"
        - "ECB mode ENCRYPT - Match"
        - "Output length \\(decryption\\): 16"
        - "ECB mode DECRYPT - Match"

