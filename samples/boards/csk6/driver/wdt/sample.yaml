tests:
  sample.board.csk6.driver.wdt:
    platform_allow: csk6002_c3_nano csk6002_9s_nano csk6011a_9s_nano
    tags: csk6
    timeout: 30
    harness: console
    harness_config:
      type: multi_line
      regex: 
        - "Handled watchdog interrupt and feed the dog(.*)"
        - "Handled watchdog interrupt again, wait for reset.(.*)"
