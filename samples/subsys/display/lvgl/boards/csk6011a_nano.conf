CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_LOG=y

CONFIG_GPIO=y

CONFIG_DISPLAY=y
CONFIG_SPI=y
CONFIG_ST7789V_CSK6=y
CONFIG_ST7789V_CSK6_ROTATE_90=y

CONFIG_KSCAN=y
CONFIG_I2C=y
CONFIG_KSCAN_FT5336=y
CONFIG_KSCAN_FT5336_INTERRUPT=y

CONFIG_LV_Z_DRIVER_CSK6_16BIT=y
CONFIG_ST7789V_CSK6_ROTATE_90=y
CONFIG_LV_Z_VDB_SIZE=100

CONFIG_LV_USE_DEMO_BENCHMARK=y

CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=n

CONFIG_LV_USE_PERF_MONITOR=y
CONFIG_LV_PERF_MONITOR_ALIGN_BOTTOM_RIGHT=y

# LVGL-ZEPHYR接口 自定义heap段
CONFIG_LV_Z_MEM_CUSTOM_SECTION=y
CONFIG_LV_Z_MEM_CUSTOM_SECTION_NAME=".psram_section"

# 自定义内存的大小配置，包含所有的LVGL对象  
CONFIG_LV_Z_MEM_POOL_MAX_SIZE=1024
CONFIG_LV_Z_MEM_POOL_NUMBER_BLOCKS=500

# 使用PSRAM的话，必须打开这个宏，这样所有的LVGL对象都从自定义段中分配内存  
CONFIG_LV_MEM_CUSTOM=y

## LVGL显存内存池配置，使用PSRAM的话 必须打开这个宏
CONFIG_LV_Z_BUFFER_ALLOC_DYNAMIC=y

# 双缓冲区会提高帧率，占会大量占用内存
# 在开启双缓冲区的情况下，确保LVGL线程不是协程，
# 且COFNIG_LV_Z_DRIVER_SPD2010_THREAD_PRIORITY的优先级必须要高于LVGL线程
# 默认将会发生死锁
# 
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_DRIVER_CSK6_16BIT_THREAD_PRIORITY=1
CONFIG_MAIN_THREAD_PRIORITY=2
