sample:
  name: USB audio headset sample
tests:
  sample.board.csk6.subsys.usb.audio.headset:
    depends_on: usb_device
    tags: usb
    platform_allow: csk6002_9s_nano csk6011a_nano csk6012_nano
    harness: console
    timeout: 20
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Found USB Headset Device"
        - "USB enabled"
